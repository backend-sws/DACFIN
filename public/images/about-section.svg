<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1F1A"/>
      <stop offset="100%" stop-color="#123D33"/>
    </linearGradient>
    <linearGradient id="chartG" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1F8A70" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1F8A70" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="500" rx="32" fill="url(#bg)"/>
  
  <!-- Subtle Grid lines -->
  <line x1="60" y1="120" x2="540" y2="120" stroke="#1F8A70" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  <line x1="60" y1="200" x2="540" y2="200" stroke="#1F8A70" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  <line x1="60" y1="280" x2="540" y2="280" stroke="#1F8A70" stroke-opacity="0.15" stroke-dasharray="4 4"/>
  <line x1="60" y1="360" x2="540" y2="360" stroke="#1F8A70" stroke-opacity="0.15" stroke-dasharray="4 4"/>

  <!-- Glowing background orb -->
  <circle cx="420" cy="180" r="120" fill="#1F8A70" fill-opacity="0.18" filter="blur(40px)"/>
  <circle cx="200" cy="320" r="90" fill="#F2A93B" fill-opacity="0.12" filter="blur(30px)"/>

  <!-- Chart Area -->
  <path d="M 80 340 Q 180 320 260 240 T 420 180 T 520 110 L 520 380 L 80 380 Z" fill="url(#chartG)"/>
  <path d="M 80 340 Q 180 320 260 240 T 420 180 T 520 110" stroke="#F2A93B" stroke-width="4" stroke-linecap="round"/>

  <!-- Chart Points -->
  <circle cx="260" cy="240" r="6" fill="#0B1F1A" stroke="#F2A93B" stroke-width="3"/>
  <circle cx="420" cy="180" r="6" fill="#0B1F1A" stroke="#CFF5E7" stroke-width="3"/>
  <circle cx="520" cy="110" r="8" fill="#F2A93B" stroke="#F7F3EA" stroke-width="3"/>

  <!-- Floating advisory glass card -->
  <rect x="80" y="80" width="220" height="100" rx="20" fill="#123D33" fill-opacity="0.8" stroke="#1F8A70" stroke-width="1.5"/>
  <circle cx="115" cy="120" r="16" fill="#1F8A70" fill-opacity="0.3"/>
  <path d="M110 120 L115 125 L122 115" stroke="#CFF5E7" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="145" y="116" font-family="'Manrope', sans-serif" font-size="12" fill="#CFF5E7" font-weight="600">SMART ADVISORY</text>
  <text x="145" y="136" font-family="'Fraunces', serif" font-size="18" fill="#F7F3EA" font-weight="700">+18.4% Return</text>
  <text x="145" y="156" font-family="'Manrope', sans-serif" font-size="11" fill="#5B6B66">Alpha Benchmark</text>

  <!-- Metric badge bottom right -->
  <rect x="340" y="320" width="180" height="80" rx="16" fill="#0B1F1A" fill-opacity="0.9" stroke="#E8E0CF" stroke-opacity="0.2"/>
  <text x="360" y="352" font-family="'Manrope', sans-serif" font-size="11" fill="#F2A93B" font-weight="700" letter-spacing="1">100% UNBIASED</text>
  <text x="360" y="378" font-family="'Fraunces', serif" font-size="16" fill="#F7F3EA">Goal-Aligned Wealth</text>
</svg>
